services:

  mariadb:
    build: ./requirements/mariadb
    volumes:
      - db_volume:/var/lib/mysql
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    networks:
      - wpsite
    restart: on-failure
  wordpress:
    depends_on:
      - mariadb
    build: ./requirements/wordpress
    restart: on-failure
    volumes:
      - wp_volume:/var/www/html
    env_file:
      - .env
    networks:
      - wpsite
    secrets:
      - db_password
      - wp_user_pass
      - wp_admin_pass
  nginx:
    depends_on:
      - wordpress
    build: ./requirements/nginx
    volumes:
      - wp_volume:/var/www/html
    networks:
      - wpsite
    ports:
      - 443:443
    restart: on-failure
    env_file:
      - .env

volumes:
  db_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "/home/${USER}/data/db"
  wp_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "/home/${USER}/data/wordpress"

networks:
  wpsite:

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_pass:
    file: ../secrets/wp_admin_pass.txt
  wp_user_pass:
    file: ../secrets/wp_user_pass.txt